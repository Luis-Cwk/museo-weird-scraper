<!doctype html>
<html>
<head><title>debug</title></head>
<body>
<canvas id="three-canvas"></canvas>
<script type="module">
window.addEventListener('error', e => {
  document.body.innerHTML += `<pre style="color:red">ERROR: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}\n${e.error?.stack || ''}</pre>`;
});
try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  document.body.innerHTML += "<pre>THREE loaded: " + (THREE.REVISION || 'unknown') + "</pre>";
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 500);
  const c = document.getElementById('three-canvas');
  const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true });
  r.setSize(window.innerWidth, window.innerHeight);
  document.body.innerHTML += "<pre>WebGLRenderer OK, canvas now " + c.width + "x" + c.height + "</pre>";
  const geom = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
  const mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);
  camera.position.z = 5;
  function loop() {
    mesh.rotation.y += 0.01;
    r.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
} catch (e) {
  document.body.innerHTML += `<pre style="color:red">CAUGHT: ${e.message}\n${e.stack}</pre>`;
}
</script>
</body>
</html>
