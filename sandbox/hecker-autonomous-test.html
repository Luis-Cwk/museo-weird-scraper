<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hecker autónomo determinista — test aislado</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #e8e6e0;
    font-family: ui-monospace, "Courier New", monospace; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 26px; }
  .card { width: min(560px, 82vw); padding: 60px 40px; border: 1px solid #3a3a3a;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #0c0c0c 100%);
    cursor: pointer; text-align: center; transition: border-color .2s, transform .1s; }
  .card:hover { border-color: #8b0000; }
  .card:active { transform: scale(.985); }
  .card h1 { font-size: 1.1rem; letter-spacing: 4px; text-transform: uppercase; margin: 0 0 14px; }
  .card p { font-size: .72rem; color: #888; letter-spacing: 1px; margin: 0; line-height: 1.7; }
  .seed-line { font-size: .68rem; color: #a55; letter-spacing: 1px; }
  .status { font-size: .7rem; letter-spacing: 3px; text-transform: uppercase; padding: 8px 18px; border: 1px solid #333; transition: all .3s; }
  .status.on { color: #ff4444; border-color: #8b0000; }
  .status.off { color: #666; }
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <h1 id="pieceTitle">Huaca — pieza</h1>
    <p>Haz clic para abrir (el sonido entra gradual).<br>Presiona ESC para desvanecerlo lentamente.</p>
    <p class="seed-line" id="seedLine"></p>
  </div>
  <div class="status off" id="status">Sonido: apagado</div>
</div>

<script>
(function () {
  "use strict";

  // ============ RNG determinista (Mulberry32) + hash FNV-1a ============
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t = (t + Math.imul(t ^ (t >>> 7), t | 61)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  const params = new URLSearchParams(location.search);
  const pieceParam = params.get('piece') || params.get('seed') || '0';
  const pieceId = 'huaca-piece-' + pieceParam;
  const seedNum = hashString(pieceId);
  let rng = mulberry32(seedNum);

  document.getElementById('pieceTitle').textContent = 'Huaca — pieza ' + pieceParam;
  document.getElementById('seedLine').textContent = 'seed ' + seedNum + ' · determinista';

  // ============ Estado ============
  let audioCtx = null, masterGain = null, masterLowpass = null, saturatorNode = null, reverbNode = null;
  let subDroneOscs = [], clusterVoices = [];
  let noiseBedGain = null, noiseBedFilter = null, noiseBedSource = null;
  let sig = null, driftTimer = null, melodyTimer = null, melodyNextTime = 0;
  let playing = false;

  // Paletas de intervalos (grado de disonancia) para el cluster.
  const INTERVAL_SETS = [
    [1.0, 2.0, 1.5, 3.0],                        // consonante (octava, quinta)
    [1.0, 1.2599, 1.4983, 2.0],                  // mayor (3ª, 4ª, 5ª)
    [1.0, 1.1892, 1.4142, 1.5874],               // disonante (2ªm, tritono, 6ªm)
    [1.0, 1.0595, 1.4142, 1.7818, 1.8877],       // muy disonante (2ªm, tritono, 7ªM)
    [1.0, 1.3348, 1.5874, 1.7818],               // 4ªJ, 6ªm, 7ªM
  ];
  // Escalas oscuras para la melodía lenta.
  const SCALES = [
    [0, 3, 5, 7, 10],               // pentatónica menor
    [0, 2, 3, 5, 7, 8, 10],         // menor natural
    [0, 1, 3, 5, 7, 8, 10],         // frigia (oscura)
    [0, 2, 4, 6, 8, 10],            // tonos enteros (inquietante)
    [0, 1, 4, 6, 7, 10],            // locria (muy oscura)
  ];
  const WAVES = ['sine', 'triangle', 'sawtooth'];

  function createSaturator(amount) {
    const ws = audioCtx.createWaveShaper();
    const samples = 1024;
    const curve = new Float32Array(samples);
    for (let i = 0; i < samples; i++) { const x = (i * 2) / samples - 1; curve[i] = Math.tanh(x * amount) / Math.tanh(amount); }
    ws.curve = curve; ws.oversample = '2x';
    return ws;
  }

  function createReverbImpulse(convolver, duration, decay) {
    const length = audioCtx.sampleRate * duration;
    const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) { const t = i / length; d[i] = (rng() * 2 - 1) * Math.pow(1 - t, decay) * (1 - t * 0.5); }
    }
    convolver.buffer = impulse;
  }

  function regenerateHeckerSignature() {
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];

    // Sub-drone: 1-3 voces graves, rango amplio, onda variable.
    const subCount = 1 + Math.floor(rng() * 3);
    const subRoots = [];
    for (let i = 0; i < subCount; i++) subRoots.push(28 + rng() * 62); // 28-90 Hz

    // Cluster: base variable (70-200 Hz), onda variable, set de intervalos.
    const clusterBase = 70 + rng() * 130;
    const intervalSet = pick(INTERVAL_SETS);
    const clusterCount = 3 + Math.floor(rng() * 4); // 3-6
    const clusterRatios = [];
    for (let i = 0; i < clusterCount; i++) {
      const r = intervalSet[Math.floor(rng() * intervalSet.length)];
      clusterRatios.push(r * (1 + (rng() - 0.5) * 0.01)); // micro-detune
    }

    sig = {
      subCount,
      subRoots,
      subWave: rng() < 0.5 ? 'sine' : 'triangle',
      clusterBase,
      clusterWave: pick(WAVES),
      clusterRatios,
      clusterLfoFreq: 0.02 + rng() * 0.14,
      baseCutoff: 450 + rng() * 2200,
      density: 0.4 + rng() * 0.6,
      noiseType: rng() < 0.5 ? 'pink' : 'white',
      noiseFilterType: pick(['bandpass', 'lowpass', 'highpass']),
      noiseFreq: 200 + rng() * 1800,
      melodyRootMidi: 38 + Math.floor(rng() * 22),   // 38-59
      melodyScale: pick(SCALES),
      melodyTempo: 0.4 + rng() * 0.6,
    };
  }

  function startSubDrone() {
    for (let i = 0; i < sig.subRoots.length; i++) {
      const osc = audioCtx.createOscillator();
      osc.type = sig.subWave;
      osc.frequency.value = sig.subRoots[i];
      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.05 + rng() * 0.08;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.4 + rng() * 0.4;
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
      const gain = audioCtx.createGain();
      gain.gain.value = 0.14 + rng() * 0.08;
      osc.connect(gain); gain.connect(masterGain);
      osc.start(); lfo.start();
      subDroneOscs.push(osc);
    }
  }

  function startHeckerCluster() {
    for (let i = 0; i < sig.clusterRatios.length; i++) {
      const osc = audioCtx.createOscillator();
      osc.type = sig.clusterWave;
      osc.frequency.value = sig.clusterBase * sig.clusterRatios[i];
      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = sig.clusterLfoFreq * (0.6 + rng() * 0.8);
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.03 + rng() * 0.04;
      lfo.connect(lfoGain);
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.value = 0.04 + rng() * 0.03;
      lfoGain.connect(voiceGain.gain);
      const panner = audioCtx.createStereoPanner();
      panner.pan.value = (i / sig.clusterRatios.length - 0.5) * 1.8;
      osc.connect(voiceGain); voiceGain.connect(panner); panner.connect(masterGain);
      osc.start(); lfo.start();
      clusterVoices.push({ osc, voiceGain, lfo, panner });
    }
  }

  function startNoiseBed() {
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    if (sig.noiseType === 'pink') {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = rng() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
        b6 = white * 0.115926;
      }
    } else {
      for (let i = 0; i < bufferSize; i++) data[i] = rng() * 2 - 1;
    }
    noiseBedSource = audioCtx.createBufferSource();
    noiseBedSource.buffer = buffer;
    noiseBedSource.loop = true;

    noiseBedFilter = audioCtx.createBiquadFilter();
    noiseBedFilter.type = sig.noiseFilterType;
    noiseBedFilter.frequency.value = sig.noiseFreq;
    noiseBedFilter.Q.value = 1.2;

    noiseBedGain = audioCtx.createGain();
    noiseBedGain.gain.value = 0.02;

    noiseBedSource.connect(noiseBedFilter);
    noiseBedFilter.connect(noiseBedGain);
    noiseBedGain.connect(masterGain);
    noiseBedSource.start();
  }

  // ==== Melodía lenta (lamento) — determinista por pieza ====
  function playMelodyNote(freq, time, dur) {
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 900 + rng() * 1500;
    filt.Q.value = 1.0;
    const g = audioCtx.createGain();
    const peak = 0.05 + rng() * 0.05;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    const pan = audioCtx.createStereoPanner();
    pan.pan.value = (rng() - 0.5) * 1.3;
    osc.connect(filt); filt.connect(g); g.connect(pan); pan.connect(masterGain);
    osc.start(time); osc.stop(time + dur + 0.05);
  }

  function melodyScheduler() {
    if (!audioCtx) return;
    while (melodyNextTime < audioCtx.currentTime + 0.15) {
      const degree = sig.melodyScale[Math.floor(rng() * sig.melodyScale.length)];
      const octave = (Math.floor(rng() * 3) - 1) * 12;
      const midi = sig.melodyRootMidi + degree + octave;
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      const dur = 1.2 + rng() * 2.8;
      playMelodyNote(freq, melodyNextTime, dur);
      melodyNextTime += sig.melodyTempo * (0.6 + rng() * 1.4);
    }
  }

  function startMelody() {
    melodyNextTime = audioCtx.currentTime + 0.4;
    melodyTimer = setInterval(melodyScheduler, 80);
  }

  // Deriva autónoma del filtro global y del noise.
  function autonomousDrift() {
    if (!audioCtx || !masterLowpass) return;
    const now = audioCtx.currentTime;
    masterLowpass.frequency.setTargetAtTime(350 + rng() * 2600, now, 2.5);
    if (noiseBedFilter) noiseBedFilter.frequency.setTargetAtTime(180 + rng() * 2200, now, 2.5);
  }

  function startHecker() {
    if (audioCtx) return;
    rng = mulberry32(seedNum); // mismo seed → mismo sonido por pieza
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    saturatorNode = createSaturator(18);
    masterLowpass = audioCtx.createBiquadFilter();
    masterLowpass.type = 'lowpass'; masterLowpass.frequency.value = 900; masterLowpass.Q.value = 0.7;
    reverbNode = audioCtx.createConvolver();
    createReverbImpulse(reverbNode, 8.0, 4.0);

    masterGain.connect(saturatorNode);
    saturatorNode.connect(masterLowpass);
    masterLowpass.connect(reverbNode);
    reverbNode.connect(audioCtx.destination);

    regenerateHeckerSignature();
    startSubDrone();
    startHeckerCluster();
    startNoiseBed();
    startMelody();

    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(0.0001, now);
    masterGain.gain.exponentialRampToValueAtTime(0.45, now + 2.5);

    driftTimer = setInterval(autonomousDrift, 3000);
    playing = true;
    console.log('[hecker] iniciado (seed ' + seedNum + '), fade-in 2.5s');
  }

  function fadeOutHecker() {
    if (!audioCtx || !playing) return;
    playing = false;
    const now = audioCtx.currentTime;
    const ctx = audioCtx;

    // Fade-out suave: decaimiento exponencial natural (τ=1.1s).
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.setTargetAtTime(0.0, now, 1.1);

    // Apagar TODO solo cuando ya es inaudible (~5.5s → ganancia ≈ -55dB).
    // Antes paraba a 3.8s con ~0.01 de ganancia audible → ese era el "tajo".
    setTimeout(() => {
      clearInterval(driftTimer);
      clearInterval(melodyTimer);
      try {
        subDroneOscs.forEach((o) => { try { o.stop(); } catch (e) {} });
        clusterVoices.forEach((v) => { try { v.osc.stop(); v.lfo.stop(); } catch (e) {} });
        if (noiseBedSource) { try { noiseBedSource.stop(); } catch (e) {} }
      } catch (e) {}
      try { ctx.close(); } catch (e) {}
      audioCtx = null; masterGain = null; masterLowpass = null; saturatorNode = null; reverbNode = null;
      subDroneOscs = []; clusterVoices = []; noiseBedGain = null; noiseBedFilter = null; noiseBedSource = null; sig = null;
      console.log('[hecker] detenido, fade-out gradual');
    }, 5500);
  }

  // ==== UI ====
  const statusEl = document.getElementById('status');
  function setStatus(on) { statusEl.textContent = on ? 'Sonido: encendido' : 'Sonido: apagado'; statusEl.className = 'status ' + (on ? 'on' : 'off'); }
  document.getElementById('card').addEventListener('click', () => { startHecker(); setStatus(true); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { fadeOutHecker(); setStatus(false); } });
})();
</script>
</body>
</html>
