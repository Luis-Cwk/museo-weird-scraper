const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);

// in its natural left-to-right orientation. Animating in the XZ plane
// orbits the sculpture, but we start at theta=0 (z = +radius) so the
// very first frame is the canonical view, not the mirror image.
let theta = 0;

// --- OrbitControls: solo rotación horizontal + zoom, sin vertical ---
// (Se inicializa DESPUÉS del renderer para tener acceso a renderer.domElement)
// Set initial spherical coords (horizontal plane)
const phi = Math.PI * 0.35;
const initSpherical = new THREE.Spherical(radius, phi, theta * Math.PI / 180);
camera.position.setFromSpherical(initSpherical);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.enableZoom = true;
controls.zoomSpeed = 0.8;
controls.minDistance = radius * 0.4;
controls.maxDistance = radius * 2.5;
// Lock vertical rotation: solo gira alrededor del eje Y
controls.minPolarAngle = Math.PI * 0.35;
controls.maxPolarAngle = Math.PI * 0.35;

// === HDRI environment + dynamic mirror reflection ===
const HDR_URL = "textures/qwantani_1k.hdr";
const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(128);
cubeRenderTarget.texture.type = THREE.HalfFloatType;
const cubeCamera = new THREE.CubeCamera(0.1, 200, cubeRenderTarget);

new RGBELoader()
  .load(HDR_URL, (texture) => {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = texture;
    scene.environment = texture;
  }, undefined, (err) => {
    console.warn("HDRI load failed, keeping solid bg:", err);
  });

// --- Lights ---
const light = new THREE.PointLight(0xffffff, 2, 0, 0);
camera.add(light);
scene.add(camera);

// --- Group for auto-rotation (children here rotate together without conflicting with OrbitControls) ---
const sceneGroup = new THREE.Group();
scene.add(sceneGroup);

const ambient = new THREE.AmbientLight(0x404040, 1);
scene.add(ambient);

// --- Voxel text sculpture ---
const voxelGeom = new THREE.BoxGeometry(LAYOUT.cellSize, LAYOUT.cellSize, LAYOUT.cellSize);
const voxelMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.02,
  metalness: 1.0,
  envMap: cubeRenderTarget.texture,
  envMapIntensity: 2.5,
});
const voxelMesh = new THREE.InstancedMesh(voxelGeom, voxelMat, LAYOUT.voxelCount);
const m = new THREE.Matrix4();
let i = 0;
for (const p of VOXEL.pixels) {
  for (let d = 0; d < LAYOUT.depth; d++) {
    if (i >= LAYOUT.voxelCount) break;
    m.makeTranslation(
      LAYOUT.centerX + p.x * LAYOUT.cellSize,
      LAYOUT.centerY - p.y * LAYOUT.cellSize,
      LAYOUT.centerZ + (d - LAYOUT.depth / 2) * LAYOUT.cellSize,
    );
    voxelMesh.setMatrixAt(i++, m);
  }
}
voxelMesh.count = i;
sceneGroup.add(voxelMesh);

// --- 300 decorative cubes ---
const cubeGeom = new THREE.BoxGeometry(1, 1, 1);
const cubeMatA = new THREE.MeshStandardMaterial({
  color: new THREE.Color(PALETTE.cubeLight),
  roughness: 0.7,
  metalness: 0.0,
});
const cubeMatB = new THREE.MeshStandardMaterial({
  color: new THREE.Color(PALETTE.cubeDark),
  roughness: 0.7,
  metalness: 0.0,
});

const decorCubes = [];
for (let k = 0; k < 300; k++) {
  const cube = new THREE.Mesh(cubeGeom, k % 2 === 0 ? cubeMatA : cubeMatB);
  cube.position.set(
    rng() * 80 - 40,
    rng() * 80 - 40,
    rng() * 80 - 40,
  );
  cube.rotation.set(rng() * Math.PI * 2, rng() * Math.PI * 2, rng() * Math.PI * 2);
  const scale = rng() * 0.3 + 0.2;
  cube.scale.set(scale, scale, scale);
  cube.userData.rotationSpeed = {
    x: rng() * 0.02 - 0.01,
    y: rng() * 0.02 - 0.01,
    z: rng() * 0.02 - 0.01,
  };
  sceneGroup.add(cube);
  decorCubes.push(cube);
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Pulse state for voxel sculpture ---
let pulsePhase = 0;

// --- Auto-rotation state (horizontal spin of sceneGroup) ---
let autoYaw = 0;

// --- Render loop ---
function animate() {
  // 1. Auto-rotate the scene group (smooth horizontal spin)
  autoYaw += 0.03;
  sceneGroup.rotation.y = autoYaw * Math.PI / 180;

  // 2. User-driven OrbitControls (drag horizontal + zoom)
  controls.update();

  pulsePhase += 0.01;
  const pulse = 1 + Math.sin(pulsePhase) * 0.05;
  voxelMesh.scale.set(pulse, pulse, pulse);

  for (const cube of decorCubes) {
    if (cube.userData.rotationSpeed) {
      cube.rotation.x += cube.userData.rotationSpeed.x;
      cube.rotation.y += cube.userData.rotationSpeed.y;
      cube.rotation.z += cube.userData.rotationSpeed.z;
    }
  }

  // Update dynamic mirror reflection: hide voxel briefly, capture env, show again
  voxelMesh.visible = false;
  cubeCamera.position.copy(camera.position);
  // Render the rotating group to the cube map (not scene alone, which misses children)
  cubeCamera.update(renderer, scene);
  voxelMesh.visible = true;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
