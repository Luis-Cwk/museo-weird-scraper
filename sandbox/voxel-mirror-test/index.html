<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Voxel Mirror Test · qwantani HDRI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: #ddd; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 10; font-size: 11px; opacity: 0.8; pointer-events: none; }
    #info a { color: #8cf; }
  </style>
</head>
<body>
<div id="info">
  <a href="https://polyhaven.com/a/qwantani" target="_blank">qwantani HDRI</a> · voxel letters as mirror material · standalone test (no huaca code touched)
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

let camera, scene, renderer, controls;
let cubeCamera, cubeRenderTarget;
let letterMesh, voxelMesh;
let mirrorMaterial;

init();

function init() {
  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setAnimationLoop(animate);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', onResize);

  // Scene + camera
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.5, 6);

  // HDRI loader (Poly Haven qwantani, AND-like clear morning)
  // Use absolute URL to dodge importmap-based relative resolution
  const HDR_URL = window.location.origin + '/textures/qwantani_1k.hdr';
  new RGBELoader()
    .load(HDR_URL, (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.background = texture;
      scene.environment = texture;
      console.log('HDRI loaded:', HDR_URL);
      // Once env is loaded, build letters + voxel
      buildLetters();
      buildVoxel();
    }, undefined, (err) => {
      console.error('HDRI load failed:', err);
    });

  // CubeCamera for dynamic mirror reflection
  cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
  cubeRenderTarget.texture.type = THREE.HalfFloatType;
  cubeCamera = new THREE.CubeCamera(1, 1000, cubeRenderTarget);

  // Mirror material — letters will reflect this cubeCamera each frame
  mirrorMaterial = new THREE.MeshStandardMaterial({
    envMap: cubeRenderTarget.texture,
    roughness: 0.05,
    metalness: 1.0,
    color: 0xffffff
  });

  // Plain ground voxel material (NOT mirror, so we can see the contrast)
  const voxelMaterial = new THREE.MeshStandardMaterial({
    color: 0x888888,
    roughness: 0.4,
    metalness: 0.0
  });

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
}

function buildLetters() {
  // Load font and create 3D text
  const fontLoader = new FontLoader();
  fontLoader.load(
    'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
    (font) => {
      const textGeo = new TextGeometry('HUACA', {
        font: font,
        size: 0.9,
        height: 0.18,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 0.03,
        bevelSize: 0.02,
        bevelOffset: 0,
        bevelSegments: 5
      });
      textGeo.computeBoundingBox();
      textGeo.center();

      letterMesh = new THREE.Mesh(textGeo, mirrorMaterial);
      letterMesh.position.set(0, 0.4, 0);
      scene.add(letterMesh);
    }
  );
}

function buildVoxel() {
  // A simple voxel cube next to the letters, non-mirror, so you can compare
  const geo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
  const voxelMat = new THREE.MeshStandardMaterial({
    color: 0x4a4a4a,
    roughness: 0.4,
    metalness: 0.0
  });
  voxelMesh = new THREE.Mesh(geo, voxelMat);
  voxelMesh.position.set(1.5, 0.4, 0);
  scene.add(voxelMesh);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  controls.update();

  // Spin voxel slightly so you can see the difference vs the static letters
  if (voxelMesh) {
    voxelMesh.rotation.y += 0.005;
  }

  // Update mirror reflection only if letters exist
  if (letterMesh) {
    letterMesh.visible = false;
    cubeCamera.update(renderer, scene);
    letterMesh.visible = true;
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
